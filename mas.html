<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tên miền không còn hoạt động</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000000;
    font-family:'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:#ffffff;
    text-align:center;
    padding:32px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:480px;
    animation: rise 0.9s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .eyebrow{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.4);
    margin-bottom:22px;
  }

  h1{
    margin:0 0 14px;
    font-size:clamp(22px,4vw,30px);
    font-weight:600;
    line-height:1.45;
    letter-spacing:-0.01em;
    color:#ffffff;
  }

  p.sub{
    margin:0 0 40px;
    font-size:15px;
    line-height:1.7;
    color:rgba(255,255,255,0.55);
    font-weight:400;
  }
  p.sub b{ color:#ffffff; font-weight:600; }

  .glass-btn{
    padding:16px 34px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color:#ffffff;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.01em;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:9px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.15) inset,
      0 20px 40px -12px rgba(0,0,0,0.8);
    transition: transform 0.35s cubic-bezier(.16,1,.3,1), background 0.35s ease, border-color 0.35s ease;
  }
  .glass-btn svg{
    width:15px; height:15px;
    transition: transform 0.35s cubic-bezier(.16,1,.3,1);
  }
  .glass-btn:hover{
    transform: translateY(-3px);
    background: rgba(255,255,255,0.11);
    border-color: rgba(255,255,255,0.38);
  }
  .glass-btn:hover svg{ transform: translate(2px,-2px); }
  .glass-btn:active{ transform: translateY(-1px); }

  .redirect{
    margin-top:34px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:rgba(255,255,255,0.38);
    letter-spacing:0.01em;
  }
  .redirect b{ color:rgba(255,255,255,0.75); font-weight:600; font-variant-numeric:tabular-nums; }

  .track{
    width:64px;
    height:2px;
    border-radius:99px;
    background: rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .track-fill{
    height:100%;
    width:100%;
    background: rgba(255,255,255,0.75);
    transform-origin:left center;
    animation: shrink 15s linear forwards;
  }
  @keyframes shrink{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }

  @media (prefers-reduced-motion: reduce){
    .wrap, .track-fill{ animation:none; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="eyebrow">Thông báo</div>

    <h1>Tên miền này không còn hoạt động</h1>
    <p class="sub">Theo dõi <b>btrang.com</b> để cập nhật.</p>

    <a class="glass-btn" href="https://btrang.com" id="cta-btn">
      Truy cập btrang.com
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17 17 7M7 7h10v10"/>
      </svg>
    </a>

    <div class="redirect">
      <span class="track"><span class="track-fill"></span></span>
      <span>Chuyển hướng sau <b id="countdown">15</b>s</span>
    </div>
  </div>

<script>
  function startRedirectCountdown(seconds){
    const countdownEl = document.getElementById('countdown');
    let remaining = seconds;

    const tick = () => {
      countdownEl.textContent = remaining;
      if(remaining <= 0){
        clearInterval(timerId);
        window.location.href = 'https://btrang.com';
        return;
      }
      remaining -= 1;
    };

    tick();
    const timerId = setInterval(tick, 1000);
  }

  startRedirectCountdown(15);
</script>

</body>
</html>
